name: Publish release

on:
  push:
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and release notes
        id: version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Only stable semantic versions can be published by this workflow.')
          if not Path(f'docs/releases/v{version}.md').is_file():
              raise SystemExit('Versioned release notes are missing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'version={version}\n')
      - name: Install build and test dependencies on the CI runner
        run: python -m pip install ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
      - name: CPU and UI tests
        run: python -m pytest -m "not gpu and not native"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create clean source ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=zip --prefix="rtx-hdr-image-studio-$env:VERSION/" --output="dist/rtx-hdr-image-studio-$env:VERSION-source.zip" HEAD
      - name: Generate SHA-256 checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          directory = Path('dist')
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
                   for path in sorted(directory.iterdir()) if path.is_file()]
          (directory / 'SHA256SUMS.txt').write_text(''.join(lines), encoding='utf-8', newline='\n')
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish versioned release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "v${VERSION}" dist/* \
            --target "${RELEASE_COMMIT}" \
            --title "RTX HDR Image Studio v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md" \
            --latest
